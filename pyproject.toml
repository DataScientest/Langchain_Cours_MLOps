[project]
name = "langchain_cours_mlops"
version = "0.2.0"
description = "Cours LangChain mis à jour"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain==1.4.2",
    "langchain-core==1.6.4",
    "langchain-community==0.4.2",
    "langgraph==1.2.12",
    "langsmith==0.14.0",
    "langchain-groq==1.1.3",
    "langchain-openai==1.6.4",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pypdf==6.19.0",
    "langchain-text-splitters==1.1.2",
    "tiktoken==0.14.0",
    "beautifulsoup4==4.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls a real model (requires RUN_LIVE=1 and an API key)"]
filterwarnings = [
    "error::DeprecationWarning:src.*",
    "ignore:`langchain-community` is being sunset:DeprecationWarning",
]
